[project]
name = "f1-podium-prediction"
version = "0.1.0"
description = "F1 winner/podium prediction: pre-weekend and post-quali models"
requires-python = ">=3.10"
dependencies = [
    "fastf1>=3.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "requests>=2.31",
    "torch>=2.4",
]

[dependency-groups]
dev = ["jupyterlab>=4", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
